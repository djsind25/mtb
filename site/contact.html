<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — MyTrashBid</title>
<meta name="description" content="How to reach MyTrashBid — through the in-app Contact Administrator button or by email.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#41A62E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#41A62E; --green-deep:#2E7D22; --charcoal:#16232D; --paper:#FFFFFF;
    --bg:#F6F8F5; --ink:#16232D; --gray:#5E6B63; --line:#E1E7DE;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--ink);}
  .nav{padding:18px 24px; border-bottom:1px solid var(--line); background:var(--paper);}
  .nav a{display:inline-flex; align-items:center; gap:8px; text-decoration:none; color:var(--charcoal); font-weight:800; font-size:17px;}
  .wrap{max-width:600px; margin:0 auto; padding:40px 24px 80px;}
  h1{font-size:28px; font-weight:800; margin:0 0 20px;}
  .doc{background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:32px; line-height:1.7;}
  .doc p{margin:0 0 16px; font-size:14.5px;}
  .doc p:last-child{margin-bottom:0;}
  .doc a{color:var(--green-deep); font-weight:700; text-decoration:underline;}
</style>
</head>
<body>
<nav class="nav"><a href="/">← MyTrashBid</a></nav>
<div class="wrap">
  <h1>Contact us</h1>
  <div class="doc">
    <p>Already have an account? The fastest way to reach us is the <strong>Contact Administrator</strong> button inside your MyTrashBid portal — log in, and you'll find it right at the top of your dashboard.</p>
    <p>Not logged in, or have a general question? Email us anytime at <a href="mailto:support@mytrashbid.com">support@mytrashbid.com</a>.</p>
  </div>
</div>
</body>
</html>
