name: CI

# Fixes audit finding H-3 (ported from the MyPartyBid security audit, 2026-08-19): no CI existed
# at all — the 18-file pgTAP suite (chat RLS, staff-note leakage, suspension/deletion,
# anonymization, fee policy) was providing false assurance rather than protection, since nothing
# ran it. This runs it — plus the frontend build/lint/audit — on every push to main and every PR.
#
# Deliberately not paired with a branch-protection rule requiring this to pass before merge: this
# repo's established workflow is direct pushes to main (no PR review step yet), and turning that
# into a hard requirement is a repo-settings decision for a human to make, not something to slip
# in as a side effect of adding a workflow file.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — pgTAP suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Run pgTAP test suite
        run: supabase test db

      - name: Stop stack
        if: always()
        run: supabase stop

  frontend:
    name: Frontend — build, lint, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run build

      - run: npm run lint

      - name: Dependency audit (high/critical only)
        run: npm audit --audit-level=high
